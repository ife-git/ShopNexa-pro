# render.yaml
services:
  - type: web
    name: shopnexa-backend
    runtime: node
    plan: free
    buildCommand: cd server && npm install
    startCommand: cd server && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://shopnexa.vercel.app #replace with vercel link replace "VITE_API_URL" in vercel,json with the render link
